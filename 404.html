<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Penitentia Pizza</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1D2E4A">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <style>
    /* Pantalla completa azul, con todo centrado (no usa la grilla de la portada) */
    .np { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px var(--gutter); background: var(--azul); color: var(--blanco); text-align: center; }
    .np__in { max-width: 560px; }
    .np__in img { max-width: 70vw; height: auto; }
    .np .btn { margin-top: 8px; }
  </style>
  <main class="np">
    <div class="np__in">
      <a href="/" aria-label="Penitentia Pizza, volver al inicio"><img src="/img/firma-blanco.svg" alt="Penitentia" width="340" height="102"></a>
      <p class="portada__frase">Esa página no existe.</p>
      <p class="portada__bajada">Pero las pizzas sí. Volvé al inicio y armá tu pedido.</p>
      <a class="btn btn--blanco" href="/#catalogo">Ir al catálogo</a>
    </div>
  </main>
</body>
</html>
